<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d">
  <title id="t">Lifecycle of one tool call</title>
  <desc id="d">Sequence: Claude sends tools/call, the proxy holds it and asks the daemon, the daemon sends a Telegram card, you tap; Allow forwards to the server and returns its result, Block returns error -32001, cancellation withdraws the card.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9a6700"/></marker>
  </defs>
  <style>
    .t{font:700 22px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
    .h{font:600 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
    .s{font:400 13.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
    .q{font:400 12.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636e}
    .m{font:500 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2328}
    .n{font:700 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
    .s,.m,.q{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .tag{font:700 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.05em}
  </style>
  <rect x="1" y="1" width="1198" height="758" rx="18" fill="#fff" stroke="#d1d9e0"/>
  <text x="40" y="50" class="t">Lifecycle of one tool call</text>
  <text x="40" y="74" class="q">Handshake and tools/list pass straight through; anything that does something waits here.</text>

  <!-- lanes -->
  <g>
    <rect x="70" y="96" width="150" height="42" rx="9" fill="#f6f8fa" stroke="#d1d9e0"/><text x="145" y="122" text-anchor="middle" class="h">Claude</text>
    <rect x="300" y="96" width="150" height="42" rx="9" fill="#ddf4ff" stroke="#0969da"/><text x="375" y="122" text-anchor="middle" class="h">Gate proxy</text>
    <rect x="530" y="96" width="150" height="42" rx="9" fill="#ddf4ff" stroke="#0969da"/><text x="605" y="122" text-anchor="middle" class="h">Daemon</text>
    <rect x="760" y="96" width="150" height="42" rx="9" fill="#f6f8fa" stroke="#d1d9e0"/><text x="835" y="122" text-anchor="middle" class="h">You (Telegram)</text>
    <rect x="990" y="96" width="150" height="42" rx="9" fill="#f6f8fa" stroke="#d1d9e0"/><text x="1065" y="122" text-anchor="middle" class="h">MCP server</text>
  </g>
  <g stroke="#d1d9e0" stroke-width="2" stroke-dasharray="4 5">
    <line x1="145" y1="140" x2="145" y2="740"/><line x1="375" y1="140" x2="375" y2="740"/>
    <line x1="605" y1="140" x2="605" y2="740"/><line x1="835" y1="140" x2="835" y2="740"/>
    <line x1="1065" y1="140" x2="1065" y2="740"/>
  </g>

  <!-- steps -->
  <g>
    <circle cx="160" cy="170" r="11" fill="#1f2328"/><text x="160" y="174" text-anchor="middle" class="n">1</text>
    <line x1="147" y1="182" x2="369" y2="182" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/>
    <text x="180" y="174" class="m">tools/call write_file {path, content}</text>

    <rect x="368" y="196" width="14" height="250" fill="#ddf4ff" stroke="#0969da"/>
    <circle cx="395" cy="214" r="11" fill="#1f2328"/><text x="395" y="218" text-anchor="middle" class="n">2</text>
    <text x="412" y="211" class="s">holds it, checks it is valid,</text>
    <text x="412" y="228" class="s">asks over the private socket</text>
    <line x1="382" y1="242" x2="599" y2="242" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/>

    <circle cx="625" cy="266" r="11" fill="#1f2328"/><text x="625" y="270" text-anchor="middle" class="n">3</text>
    <text x="642" y="262" class="s">redacts secrets, sends the card</text>
    <line x1="607" y1="280" x2="829" y2="280" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/>
    <text x="642" y="298" class="q">unique 128-bit button code per request</text>

    <circle cx="855" cy="322" r="11" fill="#1f2328"/><text x="855" y="326" text-anchor="middle" class="n">4</text>
    <text x="872" y="318" class="s">you read it and tap</text>
    <line x1="833" y1="340" x2="611" y2="340" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/>
    <text x="625" y="360" class="q">checked: your user · your private chat · this message · this code</text>
  </g>

  <!-- allow -->
  <rect x="60" y="384" width="1100" height="150" rx="12" fill="#dafbe1" fill-opacity=".45" stroke="#1a7f37"/>
  <text x="76" y="406" class="tag" fill="#1a7f37">ALLOW</text>
  <line x1="603" y1="420" x2="385" y2="420" stroke="#1a7f37" stroke-width="2" marker-end="url(#g)"/>
  <text x="420" y="413" class="s">"allow"</text>
  <line x1="383" y1="452" x2="1059" y2="452" stroke="#1a7f37" stroke-width="2" marker-end="url(#g)"/>
  <text x="700" y="445" class="s">forwarded unchanged (first time the server sees it)</text>
  <line x1="1063" y1="486" x2="151" y2="486" stroke="#1a7f37" stroke-width="2" marker-end="url(#g)"/>
  <text x="560" y="479" class="s">server result relayed to Claude</text>
  <text x="625" y="518" class="q">card edited: "Allowed" · decision written to the local activity log (no arguments)</text>

  <!-- block -->
  <rect x="60" y="548" width="1100" height="86" rx="12" fill="#ffebe9" fill-opacity=".5" stroke="#cf222e"/>
  <text x="76" y="570" class="tag" fill="#cf222e">BLOCK · NO ANSWER (120 s) · TELEGRAM OFFLINE · ANY ERROR</text>
  <line x1="373" y1="604" x2="151" y2="604" stroke="#cf222e" stroke-width="2" marker-end="url(#r)"/>
  <text x="168" y="597" class="m">error -32001</text>
  <text x="420" y="602" class="s">the MCP server never receives the request</text>
  <g transform="translate(1065 604)"><circle r="15" fill="#fff" stroke="#cf222e" stroke-width="3"/><line x1="-10" y1="10" x2="10" y2="-10" stroke="#cf222e" stroke-width="3"/></g>

  <!-- cancel -->
  <rect x="60" y="648" width="1100" height="92" rx="12" fill="#fff8c5" fill-opacity=".6" stroke="#9a6700"/>
  <text x="76" y="670" class="tag" fill="#9a6700">CLAUDE CANCELS WHILE YOU DECIDE</text>
  <line x1="147" y1="692" x2="369" y2="692" stroke="#9a6700" stroke-width="2" marker-end="url(#y)"/>
  <text x="168" y="686" class="m">notifications/cancelled</text>
  <line x1="377" y1="712" x2="599" y2="712" stroke="#9a6700" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#y)"/>
  <text x="392" y="730" class="q">socket closed</text>
  <line x1="607" y1="712" x2="829" y2="712" stroke="#9a6700" stroke-width="2" marker-end="url(#y)"/>
  <text x="622" y="730" class="q">card → "Cancelled"; a late tap does nothing</text>
  <g transform="translate(1065 704)"><circle r="15" fill="#fff" stroke="#9a6700" stroke-width="3"/><line x1="-10" y1="10" x2="10" y2="-10" stroke="#9a6700" stroke-width="3"/></g>
</svg>

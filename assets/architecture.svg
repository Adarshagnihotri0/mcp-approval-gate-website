<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
  <title id="t">Architecture</title>
  <desc id="d">Claude Desktop launches each MCP server through a stdio proxy; Claude Web reaches an HTTP proxy through your gateway. All proxies ask one approval daemon over a private Unix socket; the daemon is the only Telegram poller and asks your paired chat.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker>
  </defs>
  <style>
    .t{font:700 22px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
    .h{font:600 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
    .s{font:400 13.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636e}
    .m{font:500 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2328}
    .z{font:600 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636e;letter-spacing:.06em}
    .l{font:600 12.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0969da}
  </style>
  <rect x="1" y="1" width="1198" height="698" rx="18" fill="#fff" stroke="#d1d9e0"/>
  <text x="40" y="52" class="t">How a request travels</text>
  <text x="40" y="78" class="s">One proxy per MCP server, one daemon for all approvals, one Telegram poller.</text>

  <!-- your computer zone -->
  <rect x="24" y="100" width="910" height="576" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-dasharray="7 6"/>
  <text x="44" y="126" class="z">YOUR COMPUTER</text>

  <!-- Claude Desktop -->
  <rect x="48" y="150" width="190" height="250" rx="12" fill="#fff" stroke="#d1d9e0"/>
  <text x="143" y="182" text-anchor="middle" class="h">Claude Desktop</text>
  <text x="143" y="204" text-anchor="middle" class="s">starts each server</text>
  <text x="143" y="222" text-anchor="middle" class="s">from its config</text>
  <rect x="66" y="246" width="154" height="34" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="143" y="268" text-anchor="middle" class="m">filesystem</text>
  <rect x="66" y="290" width="154" height="34" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="143" y="312" text-anchor="middle" class="m">github</text>
  <rect x="66" y="334" width="154" height="34" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="143" y="356" text-anchor="middle" class="m">notes</text>

  <!-- proxies -->
  <g>
    <rect x="300" y="246" width="190" height="34" rx="7" fill="#ddf4ff" stroke="#0969da"/>
    <text x="395" y="268" text-anchor="middle" class="m">stdio proxy</text>
    <rect x="300" y="290" width="190" height="34" rx="7" fill="#ddf4ff" stroke="#0969da"/>
    <text x="395" y="312" text-anchor="middle" class="m">stdio proxy</text>
    <rect x="300" y="334" width="190" height="34" rx="7" fill="#ddf4ff" stroke="#0969da"/>
    <text x="395" y="356" text-anchor="middle" class="m">stdio proxy</text>
  </g>
  <text x="395" y="226" text-anchor="middle" class="h">Gate proxies</text>
  <line x1="220" y1="263" x2="296" y2="263" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="220" y1="307" x2="296" y2="307" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="220" y1="351" x2="296" y2="351" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
  <text x="258" y="244" text-anchor="middle" class="s">stdio</text>

  <!-- real servers -->
  <text x="650" y="226" text-anchor="middle" class="h">Real MCP servers</text>
  <rect x="560" y="246" width="180" height="34" rx="7" fill="#fff" stroke="#d1d9e0"/>
  <text x="650" y="268" text-anchor="middle" class="m">npx server-filesystem</text>
  <rect x="560" y="290" width="180" height="34" rx="7" fill="#fff" stroke="#d1d9e0"/>
  <text x="650" y="312" text-anchor="middle" class="m">docker github-mcp</text>
  <rect x="560" y="334" width="180" height="34" rx="7" fill="#fff" stroke="#d1d9e0"/>
  <text x="650" y="356" text-anchor="middle" class="m">python notes_server</text>
  <line x1="490" y1="263" x2="556" y2="263" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="307" x2="556" y2="307" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="351" x2="556" y2="351" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
  <text x="523" y="244" text-anchor="middle" class="l">only if allowed</text>

  <!-- Claude Web path -->
  <rect x="48" y="430" width="190" height="64" rx="12" fill="#fff" stroke="#d1d9e0"/>
  <text x="143" y="458" text-anchor="middle" class="h">Your HTTPS gateway</text>
  <text x="143" y="478" text-anchor="middle" class="s">TLS + authentication</text>
  <rect x="300" y="444" width="190" height="34" rx="7" fill="#ddf4ff" stroke="#0969da"/>
  <text x="395" y="466" text-anchor="middle" class="m">http proxy</text>
  <rect x="560" y="444" width="180" height="34" rx="7" fill="#fff" stroke="#d1d9e0"/>
  <text x="650" y="466" text-anchor="middle" class="m">remote MCP server</text>
  <line x1="238" y1="461" x2="296" y2="461" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="461" x2="556" y2="461" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>

  <!-- daemon -->
  <rect x="300" y="540" width="440" height="110" rx="14" fill="#fff" stroke="#0969da" stroke-width="2"/>
  <text x="520" y="572" text-anchor="middle" class="h">Approval daemon</text>
  <text x="520" y="594" text-anchor="middle" class="s">renders the card · redacts secrets · waits for your tap</text>
  <text x="520" y="614" text-anchor="middle" class="s">Always-allow rules · /status /rules /clear · 24 h session</text>
  <text x="520" y="636" text-anchor="middle" class="m">one process (file lock) · restarts automatically</text>
  <path d="M395 368 L395 400 M395 478 L395 536" stroke="#0969da" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
  <path d="M395 400 L395 440" stroke="#0969da" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
  <line x1="395" y1="480" x2="395" y2="536" stroke="#0969da" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="408" y="518" class="l">private Unix socket (0600)</text>

  <!-- state -->
  <rect x="48" y="540" width="190" height="110" rx="12" fill="#fff" stroke="#d1d9e0"/>
  <text x="143" y="566" text-anchor="middle" class="h">Private state (0700)</text>
  <text x="143" y="588" text-anchor="middle" class="s">bot token · pairing</text>
  <text x="143" y="606" text-anchor="middle" class="s">24 h session</text>
  <text x="143" y="624" text-anchor="middle" class="s">activity log (no arguments)</text>
  <line x1="238" y1="595" x2="296" y2="595" stroke="#59636e" stroke-width="2"/>

  <!-- internet zone -->
  <text x="966" y="126" class="z">INTERNET</text>
  <rect x="958" y="430" width="220" height="64" rx="12" fill="#fff" stroke="#d1d9e0"/>
  <text x="1068" y="458" text-anchor="middle" class="h">Claude Web</text>
  <text x="1068" y="478" text-anchor="middle" class="s">custom connector</text>
  <path d="M958 446 H 900 V 410 H 143 V 424" fill="none" stroke="#59636e" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#a)"/>
  <rect x="600" y="400" width="166" height="20" rx="4" fill="#f6f8fa"/>
  <text x="683" y="414" text-anchor="middle" class="s">Claude Web → your gateway</text>

  <rect x="958" y="540" width="220" height="110" rx="12" fill="#fff" stroke="#d1d9e0"/>
  <text x="1068" y="568" text-anchor="middle" class="h">Telegram</text>
  <text x="1068" y="590" text-anchor="middle" class="s">your paired private chat</text>
  <rect x="992" y="606" width="70" height="28" rx="7" fill="#cf222e"/>
  <text x="1027" y="625" text-anchor="middle" style="font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff">Block</text>
  <rect x="1074" y="606" width="70" height="28" rx="7" fill="#1a7f37"/>
  <text x="1109" y="625" text-anchor="middle" style="font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff">Allow</text>
  <line x1="740" y1="595" x2="952" y2="595" stroke="#0969da" stroke-width="2" marker-end="url(#b)"/>
  <text x="846" y="583" text-anchor="middle" class="l">HTTPS long-poll</text>
  <text x="846" y="615" text-anchor="middle" class="s">the only Telegram poller</text>
</svg>
